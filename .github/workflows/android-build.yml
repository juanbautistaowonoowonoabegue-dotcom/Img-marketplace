name: Build Android APK
on:
  push:
    branches:
      - main # O el nombre de tu rama principal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Usamos la misma versión que tienes tú

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build --if-present # Esto prepara tu carpeta public

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build with Capacitor
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CompraYa-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          

      - name: Dar permisos de ejecucion a Gradle
        run: chmod +x ./android/gradlew

      - name: Build with Capacitor
        run: |
          npx cap sync android
          cd android && ./gradlew assembleDebug