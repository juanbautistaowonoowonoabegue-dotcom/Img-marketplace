<!DOCTYPE html>

<head>

<title>Método de pago – Compra Ya</title>
<link rel="stylesheet" href="/css/styles.css">
<script>
  const q = window.location.search;
  const hasCart = sessionStorage.getItem("pendingOrder") || localStorage.getItem("cart");
  if (hasCart) {
    window.location.replace("caritodecompras.html" + q + "#pago");
  } else {
    window.location.replace("peninsula-de-pagos.html" + q);
  }
</script>
