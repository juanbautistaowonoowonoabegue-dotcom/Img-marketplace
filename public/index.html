<style>
:root{
  --blue:#2563FF; --blue-deep:#1A4FD8; --ink:#0F172A; --text:#475569;
  --surface:#F6F9FF; --white:#fff; --r:24px;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{

    radial-gradient(60% 45% at 50% 0%,#E7EEFF 0%,transparent 70%),var(--surface);
  -webkit-font-smoothing:antialiased;
}

/* ── Panel responsive ── */
.panel{
  width:100%; max-width:440px; text-align:center;
  background:var(--white); border:1px solid #E6EDF8; border-radius:var(--r);
  box-shadow:0 12px 40px rgba(15,23,42,.08);
  padding:40px 28px 32px;
  animation:rise .5s var(--ease) both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

h1{font-size:clamp(1.6rem,6vw,2.1rem);line-height:1.15;letter-spacing:-.02em;margin:22px 0 10px}
h1 span{color:var(--blue)}
p.sub{color:var(--text);font-size:clamp(.95rem,3.6vw,1.05rem);max-width:32ch;margin:0 auto}

/* ── SVG animado, centrado ── */
.mark{display:block;margin:0 auto;width:clamp(96px,26vw,132px);height:auto;overflow:visible}
.mark .ring{transform-origin:60px 60px;animation:pulse 2.6s var(--ease) infinite}
.mark .ring:nth-of-type(2){animation-delay:.65s}
.mark .ring:nth-of-type(3){animation-delay:1.3s}
@keyframes pulse{0%{opacity:.5;transform:scale(.7)}100%{opacity:0;transform:scale(1.25)}}
.mark .cart{stroke-dasharray:180;stroke-dashoffset:180;animation:draw 1.4s var(--ease) .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.mark .wheel{opacity:0;animation:pop .4s var(--ease) 1.2s forwards}
.mark .wheel.b{animation-delay:1.35s}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.mark .disc{animation:float 3.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}

/* ── Botón único ── */
.cta{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;min-height:58px;margin:28px 0 14px;padding:0 20px;
  font:600 1.02rem/1 inherit;color:var(--white);cursor:pointer;
  background:linear-gradient(135deg,var(--blue),var(--blue-deep));
  border:0;border-radius:16px;box-shadow:0 8px 24px rgba(37,99,255,.32);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease);
  text-decoration:none;
}
.cta:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(37,99,255,.38)}
.cta:active{transform:translateY(0) scale(.985)}
.cta:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.cta svg{flex:0 0 auto}

.foot{font-size:.82rem;color:#94A3B8}
.foot a{color:var(--text)}

@media (min-width:768px){

@media (min-width:1200px){

@media (max-width:380px){

}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .mark .cart{stroke-dashoffset:0}.mark .wheel{opacity:1}
}
