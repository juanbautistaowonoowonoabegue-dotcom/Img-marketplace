<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Detalle Servicio – Compra Ya GE</title>
<meta name="description" content="Detalle completo del servicio en Compra Ya.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<script src="/js/utils.js" defer></script>
<script type="module" src="/js/compra-ya-bridge.mjs"></script>
<style>
:root {
  --blue:#1A73E8;--blue-d:#1558C0;--blue-05:rgba(26,115,232,.05);--blue-08:rgba(26,115,232,.08);
  --blue-12:rgba(26,115,232,.12);--blue-20:rgba(26,115,232,.20);
  --teal:#0EA5E9;--emerald:#10B981;--amber:#F59E0B;--rose:#F43F5E;--violet:#8B5CF6;--orange:#F97316;
  --bg:#F2F4F7;--white:#FFFFFF;--card:#FFFFFF;--surf:#F8FAFC;
  --text:#0F172A;--text2:#1E293B;--text3:#475569;--muted:#6B7280;--subtle:#94A3B8;
  --border:rgba(15,23,42,.07);--border-md:rgba(15,23,42,.11);--border-str:rgba(15,23,42,.17);
  --sh-sm:0 1px 4px rgba(15,23,42,.06),0 2px 8px rgba(15,23,42,.04);
  --sh-md:0 4px 14px rgba(15,23,42,.08),0 1px 3px rgba(15,23,42,.05);
  --sh-lg:0 8px 30px rgba(15,23,42,.10),0 2px 8px rgba(15,23,42,.05);
  --fh:'Plus Jakarta Sans',sans-serif;--fb:'DM Sans',sans-serif;
  --nav-h:64px;--r:10px;--rg:14px;--rl:18px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;padding-bottom:calc(var(--nav-h)+24px);-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,rgba(26,115,232,.05) 1.2px,transparent 1.2px),radial-gradient(circle,rgba(14,165,233,.03) 1px,transparent 1px);
  background-size:26px 26px,13px 13px;background-position:0 0,13px 13px}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-md);border-radius:99px}

/* ── HEADER ── */
.hdr{position:fixed;top:0;left:0;right:0;z-index:700;height:58px;
  background:rgba(255,255,255,.96);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;
  padding:0 16px;box-shadow:var(--sh-sm)}
.hdr-back{width:34px;height:34px;border-radius:50%;background:var(--surf);
  border:1.5px solid var(--border-md);color:var(--text3);display:flex;
  align-items:center;justify-content:center;cursor:pointer;text-decoration:none;
  transition:all .22s;flex-shrink:0}
.hdr-back:hover{background:var(--blue-05);border-color:var(--blue-20);color:var(--blue)}
.hdr-title{flex:1;font-family:var(--fh);font-size:.95rem;font-weight:700;
  color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-actions{display:flex;gap:6px}
.hdr-btn{width:34px;height:34px;border-radius:50%;background:var(--surf);
  border:1.5px solid var(--border-md);color:var(--muted);display:flex;
  align-items:center;justify-content:center;cursor:pointer;transition:all .22s;text-decoration:none}
.hdr-btn:hover{background:var(--blue-05);border-color:var(--blue-20);color:var(--blue)}
.hdr-btn.config-btn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.25);color:#B45309;display:none}
.hdr-btn.config-btn.visible{display:flex}

main{padding-top:58px;position:relative;z-index:1}

/* ── LOADING ── */
.page-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:60vh;gap:12px}
.spinner{width:36px;height:36px;border:3px solid var(--border-md);
  border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.page-loading p{font-size:.82rem;color:var(--muted);font-family:var(--fh)}

/* ── GALERÍA HERO ── */
.gallery-hero{position:relative;height:280px;background:var(--text);overflow:hidden}
.gallery-track{display:flex;height:100%;transition:transform .4s cubic-bezier(.4,0,.2,1)}
.gallery-slide{flex-shrink:0;width:100%;height:100%;position:relative}
.gallery-slide img{width:100%;height:100%;object-fit:cover;display:block}
.gallery-slide .slide-placeholder{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--blue),#0D47A1)}
.gallery-slide .slide-placeholder svg{width:72px;height:72px;opacity:.3}

.gallery-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(15,23,42,.65) 0%,transparent 50%);pointer-events:none}
.gallery-counter{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.5);
  color:#fff;font-size:.68rem;font-weight:700;padding:4px 10px;border-radius:99px;
  font-family:var(--fh);backdrop-filter:blur(8px)}
.gallery-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  display:flex;gap:5px}
.g-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.45);
  transition:all .3s;cursor:pointer}
.g-dot.active{background:#fff;width:16px;border-radius:3px}
.gallery-prev,.gallery-next{position:absolute;top:50%;transform:translateY(-50%);
  width:36px;height:36px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);
  border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer;backdrop-filter:blur(8px);transition:all .2s}
.gallery-prev{left:12px}.gallery-next{right:12px}
.gallery-prev:hover,.gallery-next:hover{background:rgba(255,255,255,.32)}
/* hide arrows if only 1 slide */
.single-slide .gallery-prev,.single-slide .gallery-next,.single-slide .gallery-counter{display:none}

/* ── LOGO BADGE ── */
.logo-badge{position:absolute;bottom:-24px;left:20px;z-index:10;
  width:64px;height:64px;border-radius:16px;background:#fff;
  border:2.5px solid #fff;box-shadow:var(--sh-lg);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo-badge img{width:52px;height:52px;object-fit:contain}
.logo-badge .logo-fb{width:100%;height:100%;display:flex;align-items:center;
  justify-content:center;font-family:var(--fh);font-weight:900;font-size:1.1rem}

/* ── CONTENT ── */
.content{padding:36px 16px 0}

.service-header{margin-bottom:16px}
.service-eyebrow{display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:99px;font-size:.6rem;font-weight:700;
  font-family:var(--fh);letter-spacing:.4px;margin-bottom:8px}
.service-name{font-family:var(--fh);font-size:1.35rem;font-weight:800;
  color:var(--text);line-height:1.15;letter-spacing:-.03em;margin-bottom:6px}
.service-desc{font-size:.84rem;color:var(--muted);line-height:1.65;margin-bottom:10px}

.badges-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;
  border-radius:99px;font-size:.62rem;font-weight:700;font-family:var(--fh)}
.badge-verified{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);color:#059669}
.badge-open{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);color:#059669}
.badge-closed{background:rgba(244,63,94,.07);border:1px solid rgba(244,63,94,.18);color:#BE123C}
.badge-cat{background:var(--blue-05);border:1px solid var(--blue-12);color:var(--blue)}

/* ── RATING ── */
.rating-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.stars{display:flex;gap:2px}
.star{width:16px;height:16px;color:#F59E0B}
.star.empty{color:var(--border-str)}
.rating-num{font-family:var(--fh);font-size:.88rem;font-weight:700;color:var(--text)}
.rating-count{font-size:.75rem;color:var(--muted)}

/* ── ACTION BUTTONS ── */
.action-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.action-btn{display:flex;align-items:center;justify-content:center;gap:7px;
  height:46px;border:none;border-radius:13px;font-family:var(--fh);
  font-weight:700;font-size:.82rem;cursor:pointer;transition:all .25s;text-decoration:none}
.btn-wa{background:#25D366;color:#fff}
.btn-wa:hover{background:#1DAA54;transform:translateY(-1px)}
.btn-call{background:var(--surf);border:1.5px solid var(--border-md);color:var(--text3)}
.btn-call:hover{border-color:var(--blue-20);color:var(--blue)}
.btn-web{grid-column:1/-1;background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(26,115,232,.22)}
.btn-web:hover{background:var(--blue-d);transform:translateY(-1px)}

/* ── SECTION TITLES ── */
.sec-title{font-family:var(--fh);font-size:.88rem;font-weight:800;
  display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--text)}
.sec-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sec-title span{color:var(--blue)}

/* ── INFO CARDS ── */
.info-section{margin-bottom:22px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info-card{background:var(--white);border:1px solid var(--border);border-radius:13px;padding:12px 13px}
.info-card.full{grid-column:1/-1}
.info-label{font-size:.59rem;color:var(--blue);font-family:var(--fh);
  text-transform:uppercase;letter-spacing:.9px;margin-bottom:4px;font-weight:700}
.info-val{font-size:.8rem;color:var(--text2);line-height:1.5;white-space:pre-line}
.info-val a{color:var(--blue);text-decoration:none}

/* ── HORARIO ── */
.horario-grid{display:flex;flex-direction:column;gap:4px}
.horario-row{display:flex;justify-content:space-between;align-items:center;
  padding:5px 0;border-bottom:1px solid var(--border);font-size:.78rem}
.horario-row:last-child{border-bottom:none}
.horario-day{color:var(--muted);font-weight:500}
.horario-time{color:var(--text2);font-weight:600;font-family:var(--fh)}
.horario-time.cerrado{color:var(--rose)}

/* ── MAPA ── */
.map-section{margin-bottom:22px}
.map-wrap{border-radius:var(--rl);overflow:hidden;border:1px solid var(--border);
  box-shadow:var(--sh-sm);height:200px;background:var(--surf);
  display:flex;align-items:center;justify-content:center;position:relative}
.map-wrap iframe{width:100%;height:100%;border:none;display:block}
.map-placeholder{display:flex;flex-direction:column;align-items:center;gap:8px;
  color:var(--muted);font-size:.8rem;font-family:var(--fh)}
.map-addr{margin-top:8px;font-size:.78rem;color:var(--muted);
  display:flex;align-items:flex-start;gap:6px}
.map-addr svg{flex-shrink:0;margin-top:1px}

/* ── RESEÑAS ── */
.reviews-section{margin-bottom:22px}
.review-summary{background:var(--white);border:1px solid var(--border);
  border-radius:var(--rl);padding:16px;margin-bottom:12px;
  display:flex;align-items:center;gap:16px}
.big-rating{text-align:center}
.big-num{font-family:var(--fh);font-size:2.4rem;font-weight:900;color:var(--text);line-height:1}
.big-label{font-size:.62rem;color:var(--muted);margin-top:2px}
.rating-bars{flex:1}
.rbar-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.rbar-lbl{font-size:.65rem;color:var(--muted);width:8px;text-align:right;flex-shrink:0}
.rbar-track{flex:1;height:5px;background:var(--border-md);border-radius:99px;overflow:hidden}
.rbar-fill{height:100%;background:#F59E0B;border-radius:99px;transition:width .6s ease}
.rbar-count{font-size:.62rem;color:var(--muted);width:20px;text-align:right;flex-shrink:0}

.review-form{background:var(--white);border:1px solid var(--border);
  border-radius:var(--rl);padding:14px;margin-bottom:12px}
.review-form-title{font-family:var(--fh);font-size:.8rem;font-weight:700;margin-bottom:10px;color:var(--text)}
.star-picker{display:flex;gap:6px;margin-bottom:10px}
.star-pick{width:30px;height:30px;cursor:pointer;color:var(--border-str);transition:color .15s}
.star-pick.active,.star-pick:hover{color:#F59E0B}
.review-textarea{width:100%;border:1.5px solid var(--border-md);border-radius:10px;
  padding:10px 12px;font-family:var(--fb);font-size:.82rem;color:var(--text);
  background:var(--surf);resize:none;outline:none;min-height:72px;transition:border-color .2s}
.review-textarea:focus{border-color:var(--blue)}
.review-submit{width:100%;height:40px;background:var(--blue);color:#fff;border:none;
  border-radius:10px;font-family:var(--fh);font-weight:700;font-size:.8rem;
  cursor:pointer;margin-top:8px;transition:all .2s}
.review-submit:hover{background:var(--blue-d)}
.review-submit:disabled{opacity:.5;cursor:not-allowed}
.review-login-msg{font-size:.75rem;color:var(--muted);text-align:center;padding:8px 0}

.review-list{display:flex;flex-direction:column;gap:8px}
.review-card{background:var(--white);border:1px solid var(--border);
  border-radius:13px;padding:13px}
.review-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.review-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--teal));
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-family:var(--fh);font-size:.75rem;font-weight:700;color:#fff}
.review-meta{flex:1}
.review-author{font-family:var(--fh);font-size:.78rem;font-weight:700;color:var(--text)}
.review-date{font-size:.65rem;color:var(--muted)}
.review-stars{display:flex;gap:2px;margin-bottom:5px}
.review-stars svg{width:12px;height:12px}
.review-text{font-size:.78rem;color:var(--text3);line-height:1.55}
.reviews-empty{text-align:center;padding:24px;color:var(--muted);font-size:.8rem;font-family:var(--fh)}

/* ── BOTTOM NAV ── */
.bot-nav{position:fixed;bottom:0;left:0;right:0;z-index:700;height:var(--nav-h);
  background:rgba(255,255,255,.97);backdrop-filter:blur(24px);
  border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr)}
.nav-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;cursor:pointer;font-family:var(--fh);font-size:.57rem;font-weight:700;
  color:var(--subtle);border:none;background:none;letter-spacing:.4px;
  text-transform:uppercase;transition:color .2s;padding:8px 0;position:relative}
.nav-tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.nav-tab.active{color:var(--blue)}
.nav-tab.active svg{transform:translateY(-2px)}
.nav-indicator{position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:2.5px;border-radius:0 0 4px 4px;background:var(--blue);opacity:0;transition:opacity .2s}
.nav-tab.active .nav-indicator{opacity:1}

/* ── TOAST ── */
#toast{position:fixed;bottom:calc(var(--nav-h)+12px);left:50%;
  transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;
  border-radius:12px;padding:11px 20px;font-size:.82rem;font-weight:600;
  font-family:var(--fh);box-shadow:var(--sh-lg);z-index:900;opacity:0;pointer-events:none;
  transition:all .35s cubic-bezier(.34,1.56,.64,1);max-width:300px;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:#065F46}
#toast.bad{background:#9B1C1C}
</style>
</head>
<body>

<header class="hdr">
  <a href="serviciosygestiones.html" class="hdr-back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <div class="hdr-title" id="hdrTitle">Cargando…</div>
  <div class="hdr-actions">
    <a id="configBtn" class="hdr-btn config-btn" title="Configurar servicio">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
    </a>
  </div>
</header>

<main>
  <div class="page-loading" id="pageLoading">
    <div class="spinner"></div>
    <p>Cargando servicio…</p>
  </div>

  <div id="pageContent" style="display:none">
    <!-- GALERÍA -->
    <div class="gallery-hero" id="galleryHero">
      <div class="gallery-track" id="galleryTrack"></div>
      <div class="gallery-overlay"></div>
      <button class="gallery-prev" onclick="galleryNav(-1)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="gallery-next" onclick="galleryNav(1)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <div class="gallery-counter" id="galleryCounter">1 / 1</div>
      <div class="gallery-dots" id="galleryDots"></div>
      <div class="logo-badge" id="logoBadge"></div>
    </div>

    <!-- CONTENT -->
    <div class="content">
      <!-- Header info -->
      <div class="service-header">
        <div id="serviceEyebrow"></div>
        <div class="service-name" id="serviceName"></div>
        <div class="service-desc" id="serviceDesc"></div>
        <div class="badges-row" id="badgesRow"></div>
        <div class="rating-row" id="ratingRow"></div>
      </div>

      <!-- Action buttons -->
      <div class="action-btns" id="actionBtns"></div>

      <!-- Info cards -->
      <div class="info-section" id="infoSection">
        <div class="sec-title"><span class="sec-dot" style="background:var(--blue)"></span>Información <span>General</span></div>
        <div class="info-grid" id="infoGrid"></div>
      </div>

      <!-- Horarios -->
      <div class="info-section" id="horarioSection" style="display:none">
        <div class="sec-title"><span class="sec-dot" style="background:var(--emerald)"></span>Horario de <span>Atención</span></div>
        <div class="info-card">
          <div class="horario-grid" id="horarioGrid"></div>
        </div>
      </div>

      <!-- Mapa -->
      <div class="map-section" id="mapSection" style="display:none">
        <div class="sec-title"><span class="sec-dot" style="background:var(--rose)"></span>Ubicación <span>&amp; Dirección</span></div>
        <div class="map-wrap" id="mapWrap"></div>
        <div class="map-addr" id="mapAddr"></div>
      </div>

      <!-- Reseñas -->
      <div class="reviews-section" id="reviewsSection">
        <div class="sec-title"><span class="sec-dot" style="background:var(--amber)"></span>Reseñas <span>&amp; Valoraciones</span></div>
        <div class="review-summary" id="reviewSummary"></div>
        <div id="reviewFormWrap"></div>
        <div class="review-list" id="reviewList"></div>
      </div>
    </div><!-- /content -->
  </div><!-- /pageContent -->
</main>

<nav class="bot-nav">
  <button class="nav-tab" onclick="window.location.href='index-comprador.html'">
    <div class="nav-indicator"></div>
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Inicio
  </button>
  <button class="nav-tab active">
    <div class="nav-indicator"></div>
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Servicios

<script type="module">
import { initializeApp }        from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, doc, getDoc, collection, query, where,
         orderBy, getDocs, addDoc, serverTimestamp, updateDoc, increment }
                                 from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged }
                                 from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { firebaseConfig }        from './js/config.js';

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);

// ====================== URL PARAMS ======================
const params     = new URLSearchParams(location.search);
const servicioId = params.get('id');   // ← Esto es lo importante

let currentUser  = null;
let servicioData = null;
let isAdmin      = false;
let canEdit      = false;
let galleryIndex = 0;
let galleryItems = [];

// ====================== AUTH ======================
onAuthStateChanged(auth, async user => {
  currentUser = user;
  if (user) {
    try {
      const uSnap = await getDoc(doc(db, 'usuarios', user.uid));
      const uData = uSnap.data() || {};
      isAdmin = uData.role === 'admin' || uData.isAdmin === true;
    } catch(e){}
  }
  if (servicioData) afterLoad();
});

// ====================== LOAD SERVICE ======================
async function loadServicio() {
  if (!servicioId) {
    showError('ID de servicio no encontrado en la URL');
    return;
  }

  try {
    const snap = await getDoc(doc(db, 'servicios', servicioId));
    
    if (!snap.exists()) {
      showError('Servicio no encontrado en la base de datos');
      return;
    }

    servicioData = { id: snap.id, ...snap.data() };
    renderServicio();
    loadReviews();
  } catch(e) {
    console.error(e);
    showError('Error al cargar el servicio');
  }
}

// ====================== RENDER ======================
function renderServicio() {
  const d = servicioData;
  document.getElementById('hdrTitle').textContent = d.nombre || 'Servicio';
  document.title = (d.nombre || 'Servicio') + ' – Compra Ya GE';

  // Gallery
  galleryItems = d.imagenes?.length ? d.imagenes : [];
  buildGallery(galleryItems, d.logo);

  // Logo
  const lb = document.getElementById('logoBadge');
  if (d.logo) {
    lb.innerHTML = `<img src="${d.logo}" alt="${d.nombre}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="logo-fb" style="display:none;width:100%;height:100%;align-items:center;justify-content:center;font-family:var(--fh);font-weight:900;font-size:1.2rem;background:${d.colorFondo||'#1A73E8'};color:#fff">${(d.nombre||'S')[0]}</div>`;
  } else {
    lb.innerHTML = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:${d.colorFondo||'#1A73E8'};color:#fff;font-family:var(--fh);font-weight:900;font-size:1.4rem">${(d.nombre||'S')[0]}</div>`;
  }

  // Eyebrow
  const ec = d.colorCategoria || '#1A73E8';
  document.getElementById('serviceEyebrow').innerHTML =
    `<span class="service-eyebrow" style="background:${ec}18;border:1px solid ${ec}30;color:${ec}">${d.categoriaLabel || d.categoria || 'Servicio'}</span>`;

  document.getElementById('serviceName').textContent = d.nombre || '';
  document.getElementById('serviceDesc').textContent = d.descripcion || '';

  // Badges, actions, info grid, etc.
  buildActionBtns(d);
  buildInfoGrid(d);
  if (d.horario) buildHorario(d.horario);
  if (d.ubicacion?.lat) buildMap(d.ubicacion);

  document.getElementById('pageLoading').style.display = 'none';
  document.getElementById('pageContent').style.display = 'block';

  afterLoad();
}

// Resto de funciones (buildGallery, buildActionBtns, etc.) se mantienen igual...

// ====================== INIT ======================
loadServicio();
</script>
