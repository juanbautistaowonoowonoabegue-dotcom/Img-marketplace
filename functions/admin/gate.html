<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acceso restringido · Compra Ya</title>
<style>
  :root {
    --fondo: #0A0E1A;
    --superficie: #131A2B;
    --borde: #26314A;
    --texto: #E2ECF8;
    --texto-tenue: #97A6C0;
    --acento: #00DCFF;
    --error: #FF6B6B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--fondo);
    color: var(--texto);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    width: 100%;
    max-width: 380px;
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: 32px;
  }
  h1 { margin: 0 0 4px; font-size: 1.25rem; }
  p.sub { margin: 0 0 24px; color: var(--texto-tenue); font-size: .9rem; }
  .campo { margin-bottom: 16px; }
  label { display: block; margin-bottom: 6px; font-size: .875rem; font-weight: 600; }
  input {
    width: 100%;
    padding: 10px 12px;
    background: var(--fondo);
    border: 1px solid var(--borde);
    border-radius: 8px;
    color: var(--texto);
    font: inherit;
  }
  button {
    width: 100%;
    padding: 11px;
    margin-top: 8px;
    background: var(--acento);
    color: #04121A;
    border: 0;
    border-radius: 8px;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  button[disabled] { opacity: .6; cursor: progress; }
  /* Foco visible en todo control interactivo. */
  :focus-visible {
    outline: 3px solid var(--acento);
    outline-offset: 2px;
  }
  #estado { margin: 16px 0 0; font-size: .875rem; min-height: 1.5em; }
  #estado[data-tipo="error"] { color: var(--error); }
</style>
</head>
<body>
  <main>
    <h1>Acceso restringido</h1>
    <p class="sub">Panel de administración de Compra Ya.</p>

    <form id="formulario" novalidate>
      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" autocomplete="username"
               required aria-describedby="estado">
      </div>
      <div class="campo">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" autocomplete="current-password"
               required aria-describedby="estado">
      </div>
      <button type="submit" id="enviar">Entrar</button>
    </form>

    <p id="estado" role="status" aria-live="polite"></p>
  </main>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { firebaseConfig } from "/js/config.js";

const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);

const formulario = document.getElementById("formulario");
const enviar = document.getElementById("enviar");
const estado = document.getElementById("estado");

function informar(mensaje, tipo) {
  estado.textContent = mensaje;
  estado.dataset.tipo = tipo || "info";
}

// Canjea el token de identidad por la cookie de sesión que lee adminAccess.
async function abrirSesion(usuario) {
  const token = await usuario.getIdToken(true);
  const respuesta = await fetch("/admin/session", {
    method: "POST",
    headers: { Authorization: `Bearer ${token}` }
  });

  if (respuesta.ok) {
    informar("Acceso concedido. Cargando el panel…");
    window.location.reload();
    return;
  }

  await signOut(auth);
  informar(
    respuesta.status === 403
      ? "Esta cuenta no tiene permisos de administración."
      : "No se pudo iniciar la sesión. Inténtalo de nuevo.",
    "error"
  );
  enviar.disabled = false;
}

// Si ya hay sesión de Firebase activa, se intenta el canje sin pedir credenciales.
onAuthStateChanged(auth, async (usuario) => {
  if (!usuario) return;
  const { claims } = await usuario.getIdTokenResult();
  if (claims.role === "superadmin") {
    enviar.disabled = true;
    await abrirSesion(usuario);
  }
});

formulario.addEventListener("submit", async (evento) => {
  evento.preventDefault();
  enviar.disabled = true;
  informar("Verificando…");

  try {
    const credencial = await signInWithEmailAndPassword(
      auth,
      document.getElementById("correo").value.trim(),
      document.getElementById("clave").value
    );
    await abrirSesion(credencial.user);
  } catch (_) {
    // Mensaje único: no revela si el correo existe.
    informar("Credenciales incorrectas.", "error");
    enviar.disabled = false;
    document.getElementById("clave").focus();
  }
});
</script>
</body>
</html>
